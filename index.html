function makeRobot(){const model=MODELS[Math.floor(Math.random()*MODELS.length)];let id=S.nextId++,part=model.parts[Math.floor(Math.random()*model.parts.length)];let more=(S.time<117&&Math.random()<.33)?model.parts.find(p=>p!==part):null;let needed=more?[part,more]:[part];return{id,model:model.id,short:model.name,name:model.role,parts:needed,done:[],working:null,patience:rand(...model.patience),maxPatience:0,chargeNeeded:Math.random()<.63,chargeStarted:false,chargeLeft:0,chargeTotal:0,batteryReady:false,arrival:0,walk:0,seat:-1,moodHits:0,price:needed.length===2?115:75,express:0}}
function announce(message,error=false){S.flash=message;S.flashT=3.2;let t=$('#toast');if(t){t.className='toast show'+(error?' error':'');t.innerHTML=`<span>${esc(message)}</span>`}}
function begin(){S.phase='play';S.time=180;S.served=0;S.missed=0;S.coins=0;S.score=0;S.queue=[];S.bays=Array(profile.beds).fill(null);S.bag=[];S.nextId=1;S.nextArrival=rand(12,15);S.view=null;S.selectedPart=null;S.events=[];S.reaction=null;S.arrivalSerial=0;spawn();spawn();$('#cover').innerHTML='';draw()}
function spawn(){if(S.queue.length>=5){S.missed++;announce('受付が満員！お客さんが帰っちゃった…',true);return}let r=makeRobot();r.maxPatience=r.patience;S.queue.push(r);S.arrivalSerial++;announce(`${r.short}が受付に来たよ！`);draw()}
function getRobot(id){return [...S.queue,...S.bays.filter(Boolean)].find(r=>r.id===id)}
function modelBy(r){return MODELS.find(m=>m.id===r.model)||MODELS[0]}
function assign(id){let idx=S.queue.findIndex(r=>r.id===id),bed=S.bays.findIndex(x=>!x);if(idx<0)return;if(bed<0){announce('診察台が空いていないよ！',true);return}let r=S.queue.splice(idx,1)[0];r.seat=bed;r.walk=Math.max(1.2,3.3-profile.walkLevel*.6);r.walkTotal=r.walk;r.arrival=1;S.bays[bed]=r;S.view=null;announce(`${r.short}が診察台${bed+1}へ移動中！`);draw()}
function beginCharge(id){let r=getRobot(id);if(!r||r.walk>0||r.chargeStarted||!r.chargeNeeded)return;r.chargeStarted=true;r.chargeTotal=Math.max(2.5,7-profile.chargeLevel*1.3);r.chargeLeft=r.chargeTotal;announce(`${r.short}の充電開始！ 修理と同時進行できるよ`);draw()}
function takePart(p){if(S.bag.length>=profile.bagMax){announce('工具バッグがいっぱい！',true);return}S.bag.push(p);announce(`${PARTS[p].name}を持った！`);draw()}
function discardPart(p){let i=S.bag.indexOf(p);if(i>=0){S.bag.splice(i,1);announce('部品を返却したよ');draw()}}
function attach(id,loc){let r=getRobot(id),p=S.selectedPart;if(!r||r.walk>0||!p)return;if(r.working){announce('取り付けが終わるまで待ってね');return}if(r.done.includes(p)){announce('その部品はもう交換済み！');return}let i=S.bag.indexOf(p);if(i<0)return;if(!r.parts.includes(p)||PARTS[p].loc!==loc){r.moodHits++;r.patience=Math.max(0,r.patience-4);announce('違う部品・場所だよ！ ロボが不安そう…',true);draw();return}S.bag.splice(i,1);r.working={part:p,left:rand(2.5,4.1),total:4};S.selectedPart=null;announce(`${PARTS[p].name}を取り付け中！ 別の作業もできるよ`);draw()}
function finished(r){return r.done.length===r.parts.length&&(!r.chargeNeeded||r.batteryReady)&&!r.working&&r.walk<=0}
function deliver(id){let r=getRobot(id);if(!r||!finished(r))return;let good=r.patience>13&&r.moodHits===0;let tip=good?25:0;let earn=Math.max(15,r.price+tip-r.moodHits*10);S.served++;S.coins+=earn;S.score+=earn+Math.round(r.patience);S.bays[r.seat]=null;S.view=null;S.reaction={name:r.short,text:modelBy(r).thanks,time:4,good:true};announce(`${r.short}「${modelBy(r).thanks}」 +${cash(earn)}`);draw()}
function leave(r,where){if(where==='queue'){S.queue=S.queue.filter(x=>x.id!==r.id)}else{S.bays[r.seat]=null;if(S.view&&S.view.id===r.id)S.view=null}S.missed++;S.reaction={name:r.short,text:modelBy(r).sad,time:3,good:false};announce(`${r.short}「${modelBy(r).sad}」 帰ってしまった…`,true);draw()}
function step(dt){if(S.phase!=='play')return;S.time=Math.max(0,S.time-dt);S.nextArrival-=dt;S.queue.forEach(r=>r.patience=Math.max(0,r.patience-dt));S.bays.filter(Boolean).forEach(r=>{r.patience=Math.max(0,r.patience-dt);if(r.walk>0){r.walk=Math.max(0,r.walk-dt);if(!r.walk){announce(`${r.short}が診察台に到着！`);draw()}}if(r.chargeLeft>0){r.chargeLeft=Math.max(0,r.chargeLeft-dt);if(!r.chargeLeft){r.batteryReady=true;announce(`${r.short}の充電完了！`);draw()}}if(r.working){r.working.left-=dt;if(r.working.left<=0){r.done.push(r.working.part);r.working=null;announce(`${r.short}の修理が1工程完了！`);draw()}}});
for(let r of [...S.queue])if(r.patience<=0)leave(r,'queue');for(let r of [...S.bays.filter(Boolean)])if(r.patience<=0)leave(r,'bay');if(S.nextArrival<=0){spawn();S.nextArrival=rand(S.time>90?14:10,S.time>90?19:15)}if(S.reaction){S.reaction.time-=dt;if(S.reaction.time<=0){S.reaction=null;draw()}}if(S.flashT>0){S.flashT-=dt;if(S.flashT<=0){let t=$('#toast');if(t)t.className='toast'}}if(!S.time){end();return}live()}
function end(){S.phase='result';S.view=null;profile.wallet+=S.coins;profile.best=Math.max(profile.best,S.served);save();draw();drawCover()}
const zone=r=>r.walk>0?'歩いて移動中':finished(r)?'✨ お渡しOK':r.chargeLeft>0?'🔌 充電中':r.working?'🔧 修理中':'修理待ち';
function draw(){if(S.phase==='cover'){drawCover();return}let all=S.bays.filter(Boolean),queue=S.queue;let showBeds=S.bays.map((r,i)=>`<button class="bay-chip ${!r?'empty':finished(r)?'ready':''}" data-action="bed" data-id="${r?r.id:''}" ${!r?'disabled':''}><strong>診察台 ${i+1}</strong><span class="mini">${r?(r.walk>0?'<span style="font-size:24px">⌛</span>':robotSvg(r,finished(r)?'happy':(r.moodHits>0||r.patience<16)?'sad':'normal')):'<span style="font-size:28px;opacity:.5">▱</span>'}</span><small>${r?esc(zone(r)):'空いています'}</small>${r?'<span class="bed-base"></span>':''}</button>`).join('');let moving=all.filter(r=>r.walk>0).map(r=>`<span class="walking-robot" data-walk="${r.id}" style="left:${24+(1-r.walk/r.walkTotal)*48}%"><span class="mini">${robotSvg(r)}</span></span>`).join('');let queueRow=queue.slice(0,3).map(r=>`<span class="mini">${robotSvg(r,r.patience<15?'sad':'normal')}</span>`).join('');$('#app').innerHTML=`<header class="top"><div class="brand"><div class="brand-title">ロボっと工房 <small>RETRO ROBOT REPAIR SHOP</small></div><button class="corner-btn" data-action="pause" aria-label="一時停止">Ⅱ</button></div><div class="statline"><div class="pill timer ${S.time<30?'critical':''}" id="timer">${fmt(S.time)}</div><div class="pill">🔧 <span id="served">${S.served}</span> 台修理</div><div class="pill">🪙 <span id="coins">${cash(S.coins)}</span></div></div></header><div class="toast" id="toast"><span>${esc(S.flash)}</span></div><section class="section"><div class="label"><span>🏠 修理工場</span><span class="sub">診察台をタップして作業</span></div><div class="workshop"><div class="shop-banner"><span>BOT SERVICE · OPEN</span><span>✹ <i class="bulb"></i> ✹</span></div><div class="scene">${moving}<div class="counter-side"><div class="sign">受付</div><div class="queue-scene">${queueRow}</div><div class="counter-desk">RECEPTION</div></div><div class="bay-scene"><div class="bay-scene-title">🛠 WORK STATION</div><div class="bay-grid">${showBeds}</div></div></div><div class="scene-foot">${S.reaction?((S.reaction.good?'🎉 ':'😢 ')+esc(S.reaction.name)+'「'+esc(S.reaction.text)+'」'):queue.length?'受付でカルテを受け取り、修理準備をしよう！':'新しいお客さんを待っています ☕'}</div></div></section><section class="section"><div class="label"><span>📋 受付のカルテ <span style="color:#df8a5b">${queue.length}件</span></span><span class="sub">待たせると帰っちゃう！</span></div><div class="orders">${queue.length?queue.slice(0,4).map(r=>`<button class="order" data-action="chart" data-id="${r.id}"><div class="mini">${robotSvg(r,r.patience<15?'sad':'normal')}</div><div class="order-main"><span class="order-name">${esc(r.short)} <span style="font-size:10px;color:#899586">${esc(r.name)}</span></span><span class="order-desc">${r.parts.map(p=>PARTS[p].name).join('＋')} / ${r.chargeNeeded?'充電必要':'充電不要'}</span><span class="order-status"><span>カルテを見る ›</span><span class="r">あと <span id="patient-${r.id}">${Math.ceil(r.patience)}</span>秒</span></span><div class="patientbar"><span id="patientbar-${r.id}" style="width:${r.patience/r.maxPatience*100}%" class="${r.patience<17?'low':''}"></span></div></div></button>`).join(''):'<div class="empty-note">☕ ただいま受付は空いています</div>'}</div></section><section class="section"><div class="label"><span>🧰 お仕事道具</span><span class="sub">バッグ ${S.bag.length}/${profile.bagMax}</span></div><div class="controls"><button class="bigbutton warm" data-action="warehouse">📦 倉庫へ行く</button><button class="bigbutton" data-action="quickbed">🔧 診察台を確認</button></div></section><div class="bagrow"><span>👜 バッグ</span>${S.bag.map(p=>`<span class="bagitem">${PARTS[p].icon} ${PARTS[p].name}</span>`).join('')||'<span class="bagempty">まだ部品を持っていません</span>'}</div><div class="footer-note">部品を先に用意して、待ち時間をなくそう！</div>`;if(S.flashT>0){let t=$('#toast');t.className='toast show';}drawPanel()}
function live(){if(S.phase!=='play')return;let t=$('#timer');if(t){t.textContent=fmt(S.time);t.className='pill timer'+(S.time<30?' critical':'')}S.bays.filter(Boolean).filter(r=>r.walk>0).forEach(r=>{let e=$(`[data-walk=\"${r.id}\"]`);if(e)e.style.left=`${24+(1-r.walk/r.walkTotal)*48}%`});S.queue.forEach(r=>{let x=$(`#patient-${r.id}`);if(x)x.textContent=Math.ceil(r.patience);let b=$(`#patientbar-${r.id}`);if(b){b.style.width=`${r.patience/r.maxPatience*100}%`;b.className=r.patience<17?'low':''}});if(S.view&&S.view.type==='bed'){let r=getRobot(S.view.id);if(r){let x=$('#chargeleft');if(x)x.textContent=r.chargeLeft>0?`${r.chargeLeft.toFixed(1)}秒`:'完了';let y=$('#repairleft');if(y)y.textContent=r.working?`${Math.max(0,r.working.left).toFixed(1)}秒`:'完了'}}}
function panel(title,body){$('#layer').innerHTML=`<div class="shade" id="shade"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="panel-head"><b>${esc(title)}</b><button class="close" data-action="close" aria-label="閉じる">×</button></div><div class="panel-body">${body}</div></div></div>`}
function drawPanel(){if(S.phase!=='play'||!S.view){$('#layer').innerHTML='';return}let {type,id}=S.view;if(type==='warehouse'){panel('📦 部品倉庫',`<p class="help">カルテを見て必要な部品を選ぼう。バッグに入れられるのは ${profile.bagMax}個まで。倉庫に来ている間も時間は進むよ！</p><div class="warehouse">${Object.entries(PARTS).map(([key,p])=>`<button class="partcard" data-action="pick" data-id="${key}" ${S.bag.length>=profile.bagMax?'disabled':''}><span class="glyph">${p.icon}</span>${p.name}<small>タップして持っていく</small></button>`).join('')}</div><div class="chart-row"><span>バッグの中</span><b>${S.bag.map(p=>PARTS[p].icon+' '+PARTS[p].name).join('・')||'空っぽ'}</b></div>${S.bag.map((p,i)=>`<button class="cta ghost" data-action="returnpart" data-id="${i}">↩ ${PARTS[p].name}を棚に戻す</button>`).join('')}<button class="cta" data-action="close">工場に戻る ›</button>`);return}
if(type==='chart'){let r=S.queue.find(r=>r.id===id);if(!r){S.view=null;drawPanel();return}let can=S.bays.some(x=>!x);panel(`📋 ${r.short}のカルテ`,`<div class="chart-hero"><div class="mini">${robotSvg(r,r.patience<17?'sad':'normal')}</div><div><strong>${r.short}</strong><small>${esc(r.name)}<br>「${esc(modelBy(r).line)}」<br>性格：${esc(modelBy(r).temper)}</small><span class="status-tag">${r.patience<20?'⚠ 急いで！':'お待たせ中'}</span></div></div><div class="chart-row"><span>故障箇所</span><b>${r.parts.map(p=>PARTS[p].fault).join(' / ')}</b></div><div class="chart-row"><span>必要部品</span><b>${r.parts.map(p=>PARTS[p].icon+' '+PARTS[p].name).join('、')}</b></div><div class="chart-row"><span>バッテリー</span><b>${r.chargeNeeded?'🪫 要充電':'🔋 充電済み'}</b></div><div class="chart-row"><span>報酬目安</span><b>${cash(r.price)} + お礼のチップ</b></div><div class="chart-row"><span>残りの待ち時間</span><b>${Math.ceil(r.patience)}秒</b></div><button class="cta" data-action="assign" data-id="${id}" ${!can?'disabled':''}>${can?'🛏 受付して診察台へ案内':'診察台が満席だよ'}</button><button class="cta warm" data-action="warehouse">📦 先に部品を取りに行く</button>`);return}
if(type==='bed'){let r=getRobot(id);if(!r||r.seat<0){S.view=null;drawPanel();return}let walking=r.walk>0,complete=finished(r);panel(`🛏 診察台 ${r.seat+1} — ${r.short}`,`<div class="chart-hero"><div class="mini">${robotSvg(r,complete?'happy':(r.moodHits>0||r.patience<16)?'sad':'normal')}</div><div><strong>${r.short}</strong><small>${r.name}<br>${walking?'てくてく移動中…':complete?'「ありがとう！もう元気！」':'「修理よろしくね！」'}</small><span class="status-tag">${zone(r)}</span></div></div><div class="chart-row"><span>修理が必要</span><b>${r.parts.map(p=>r.done.includes(p)?'✅ '+PARTS[p].name:PARTS[p].icon+' '+PARTS[p].name).join(' / ')}</b></div><div class="chart-row"><span>充電</span><b>${r.chargeNeeded?(r.batteryReady?'✅ 完了':r.chargeStarted?'🔌 充電中':'🪫 まだ！'):'✅ 充電不要'}</b></div><div class="chart-row"><span>待ち時間</span><b>残り ${Math.ceil(r.patience)}秒</b></div>${walking?'<p class="help">ロボットが歩いている間に倉庫で部品を準備すると効率アップ！</p>':r.chargeNeeded&&!r.chargeStarted?`<button class="cta warm" data-action="charge" data-id="${id}">🔌 今すぐ充電を始める（修理と同時進行OK！）</button>`:r.chargeStarted&&!r.batteryReady?'<div class="chart-row"><span>充電中…</span><b id="chargeleft">'+r.chargeLeft.toFixed(1)+'秒</b></div>':''}${r.working?`<div class="chart-row"><span>取り付け中…</span><b id="repairleft">${r.working.left.toFixed(1)}秒</b></div>`:''}${!walking&&!complete?`<button class="cta" data-action="repair" data-id="${id}">🔧 ロボを拡大して修理する</button>`:''}${complete?`<button class="cta" data-action="deliver" data-id="${id}">🎉 修理完了！お客さんにお渡しする</button>`:''}<button class="cta ghost" data-action="warehouse">📦 部品を取りに行く</button>`);return}
if(type==='repair'){let r=getRobot(id);if(!r||r.seat<0){S.view=null;drawPanel();return}let hotspots=[['head','頭部'],['arm','アーム'],['body','胴体'],['foot','足回り']];panel(`🔧 ${r.short}を修理中`, `<div class="repairhint">バッグから部品を選んで、ロボットの対応する場所をタップ！</div><div class="repair-robot"><span class="giant">${robotSvg(r,r.patience<17?'sad':'normal')}</span>${hotspots.map(([loc,label])=>{let fixed=r.done.some(p=>PARTS[p].loc===loc),needed=r.parts.some(p=>PARTS[p].loc===loc&&!r.done.includes(p));return `<button class="socket ${fixed?'fixed':needed?'selected':''} ${loc}" data-action="socket" data-id="${loc}">${fixed?'✓ 修理済':needed?'✦ '+label:label}</button>`}).join('')}</div><div class="repairhint">${r.working?'🔧 '+PARTS[r.working.part].name+'を取り付け中…':S.selectedPart?'選択中：'+PARTS[S.selectedPart].name+' → 正しい場所をタップ':'部品を選んでね！間違えると機嫌が悪くなるよ'}</div><div class="parts-selection">${S.bag.length?S.bag.map((p,i)=>`<button class="piece ${S.selectedPart===p?'selected':''}" data-action="selectpart" data-id="${i}">${PARTS[p].icon} ${PARTS[p].name}</button>`).join(''):'<span class="help">バッグが空っぽ！倉庫で部品を取ろう</span>'}</div><button class="cta warm" data-action="warehouse">📦 倉庫へ</button><button class="cta ghost" data-action="bed" data-id="${id}">← 診察台に戻る</button>`);return}}
function drawCover(){let d=profile.day;if(S.phase==='result'){let amount=S.coins;$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">CLOSED · DAY ${d}</span><h2>おつかれさま！ ☕</h2><div class="characters"><span class="mini">${robotSvg({model:'delivery'},'happy')}</span><span class="mini">${robotSvg({model:'cleaner'},'happy')}</span><span class="mini">${robotSvg({model:'guide'},'happy')}</span></div><div class="result-stats"><div><strong>${S.served}</strong><small>修理できた台数</small></div><div><strong>${S.missed}</strong><small>帰ったお客さん</small></div><div><strong>${cash(amount)}</strong><small>本日の売上</small></div></div><p>所持金 <b>${cash(profile.wallet)}</b><br>明日はもっと上手に回せるかな？</p><button class="cta warm" data-action="shop">🛒 修理工場を強化する</button><button class="cta" data-action="next">▶ 次の日をはじめる</button><div class="help">成績や購入した設備はこの端末に保存されるよ</div></div></div>`;return}
if(S.phase==='pause'){$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">BREAK TIME</span><h2>ちょっと休憩 ☕</h2><p>残り ${fmt(S.time)}<br>準備ができたら戻ってね！</p><button class="cta" data-action="resume">▶ お仕事再開！</button><button class="cta ghost" data-action="quit">今日はここまで</button></div></div>`;return}
$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">RETRO ROBOT REPAIR SHOP</span><h1>ロボっと工房</h1><div style="font-weight:950;color:#be855c">小さな町の、3分間の修理屋さん。</div><div class="characters"><span class="mini wave">${robotSvg({model:'delivery'},'happy')}</span><span class="mini">${robotSvg({model:'cleaner'},'normal')}</span><span class="mini wave">${robotSvg({model:'guide'},'happy')}</span></div><div class="rules"><b>きょうのおしごと</b><br>① 受付でカルテを受け取り、ロボを診察台へ<br>② 倉庫で必要な部品を集めよう<br>③ 充電を開始して、修理も同時進行！<br>④ 直ったらお渡し。待たせすぎに注意！</div><p style="margin:8px 0;font-size:12px">DAY ${d} · 所持金 ${cash(profile.wallet)}<br>診察台 ${profile.beds}台 · バッグ ${profile.bagMax}個</p><button class="cta" data-action="start">🛠 お店を開ける！</button><button class="cta warm" data-action="shop">🛒 設備をアップグレード</button><div class="help">スマホのタップ操作に対応 · データは自動保存</div></div></div>`}
function shop(){let bedCost=170+profile.beds*100,bagCost=190+(profile.bagMax-2)*150,chargeCost=130+profile.chargeLevel*160,walkCost=160+profile.walkLevel*180;S.phase=S.phase==='play'?'pause':S.phase;let items=[{key:'bed',title:'🛏 診察台を1台増やす',desc:`現在 ${profile.beds}/6台。複数のロボを同時に受け入れられる`,cost:bedCost,max:profile.beds>=6},{key:'bag',title:'👜 バッグを広くする',desc:`現在 ${profile.bagMax}/5個。倉庫の往復回数を減らそう`,cost:bagCost,max:profile.bagMax>=5},{key:'charge',title:'🔌 高速充電器',desc:`充電速度アップ（レベル ${profile.chargeLevel}/3）`,cost:chargeCost,max:profile.chargeLevel>=3},{key:'walk',title:'🛼 自動案内レール',desc:`診察台までの移動を短縮（レベル ${profile.walkLevel}/3）`,cost:walkCost,max:profile.walkLevel>=3}];$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">WORKSHOP UPGRADES</span><h2>🛒 工場ショップ</h2><p>所持金 <b>${cash(profile.wallet)}</b><br>修理でもらったお金で設備を整えよう！</p><div class="shoplist">${items.map(i=>`<div class="shopentry"><div><b>${i.title}</b><small>${i.desc}</small></div><button data-action="buy" data-id="${i.key}" ${i.max||profile.wallet<i.cost?'disabled':''}>${i.max?'MAX':cash(i.cost)}</button></div>`).join('')}</div><button class="cta ghost" data-action="shopclose">← 戻る</button></div></div>`;S.shopOpened=true}
function buy(k){let price=({bed:170+profile.beds*100,bag:190+(profile.bagMax-2)*150,charge:130+profile.chargeLevel*160,walk:160+profile.walkLevel*180})[k];if(!(price<=profile.wallet))return;if(k==='bed'&&profile.beds>=6||k==='bag'&&profile.bagMax>=5||k==='charge'&&profile.chargeLevel>=3||k==='walk'&&profile.walkLevel>=3)return;profile.wallet-=price;if(k==='bed')profile.beds++;if(k==='bag')profile.bagMax++;if(k==='charge')profile.chargeLevel++;if(k==='walk')profile.walkLevel++;save();shop()}
function handle(action,id){if(action==='start'){begin();return}if(action==='pause'){S.phase='pause';drawCover();return}if(action==='resume'){S.phase='play';$('#cover').innerHTML='';draw();S.nextTick=performance.now();return}if(action==='quit'){S.phase='cover';S.view=null;$('#layer').innerHTML='';drawCover();return}if(action==='next'){profile.day++;save();begin();return}if(action==='shop'){shop();return}if(action==='buy'){buy(id);return}if(action==='shopclose'){S.shopOpened=false;if(S.phase==='result'||S.phase==='cover')drawCover();else drawCover();return}
if(S.phase!=='play')return;
if(action==='close'){S.view=null;S.selectedPart=null;drawPanel();return}if(action==='chart'){S.view={type:'chart',id:+id};drawPanel();return}if(action==='assign'){assign(+id);return}if(action==='warehouse'){S.view={type:'warehouse'};S.selectedPart=null;drawPanel();return}if(action==='pick'){takePart(id);return}if(action==='returnpart'){let p=S.bag[+id];if(p)discardPart(p);return}if(action==='quickbed'){let r=S.bays.find(Boolean);if(!r){announce('まだ診察台にロボがいないよ');return}S.view={type:'bed',id:r.id};drawPanel();return}if(action==='bed'){let r=getRobot(+id);if(!r||r.seat<0)return;S.view={type:'bed',id:r.id};drawPanel();return}if(action==='charge'){beginCharge(+id);return}if(action==='repair'){S.view={type:'repair',id:+id};S.selectedPart=null;drawPanel();return}if(action==='selectpart'){let p=S.bag[+id];if(p){S.selectedPart=p;drawPanel()}return}if(action==='socket'){if(S.view&&S.view.type==='repair')attach(S.view.id,id);return}if(action==='deliver'){deliver(+id);return}}
document.addEventListener('click',e=>{let node=e.target.closest('[data-action]');if(!node)return;e.preventDefault();handle(node.dataset.action,node.dataset.id)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.phase==='play'){S.phase='pause';drawCover()}});
function tick(t){let dt=S.nextTick?Math.min((t-S.nextTick)/1000,.07):0;S.nextTick=t;if(S.phase==='play'){step(dt)}requestAnimationFrame(tick)}
window.addEventListener('pageshow',()=>{S.nextTick=performance.now()});drawCover();requestAnimationFrame(tick);
})();
</script>
</body></html>
