/* v0.2: one-room workflow — interact with reception & workstations directly */
.scene{grid-template-columns:39% 61%;min-height:233px}
.counter-side{min-height:233px;padding-top:10px;border-right:3px dashed #ae9a79}
.counter-side .sign{font-size:12px}
.queue-scene{top:56px;left:2px;right:2px;min-height:91px;align-items:center;justify-content:flex-start;padding-left:4px}
.queue-robot{position:relative;border:0;background:transparent;padding:0;width:55px;height:72px;flex:none;margin-right:-19px;filter:drop-shadow(0 2px 1px #53634977);transition:transform .15s}
.queue-robot:nth-child(2){transform:scale(.82) translateY(7px)}
.queue-robot:nth-child(3){transform:scale(.68) translateY(17px)}
.queue-robot:focus-visible{outline:3px solid #eea460;border-radius:12px}
.queue-robot .mini{display:block;width:100%;height:100%;margin:0}
.queue-robot .mini svg{width:100%;height:100%}
.queue-more{position:absolute;top:3px;right:1px;border-radius:12px;background:#fff8df;border:2px solid #cfa475;padding:3px 5px;font-weight:1000;font-size:10px;color:#70543b}
.reception-button{position:absolute;left:5px;right:5px;bottom:29px;min-height:51px;z-index:9;border:3px solid #8c5c3b;border-radius:9px;background:#c38d64;color:#fff8db;box-shadow:inset 0 5px #e3b88a,0 4px #75492c;font-size:12px;font-weight:1000;padding:7px 2px}
.reception-button strong{display:block;font-size:13px}
.reception-button:disabled{opacity:1;background:#a88368;color:#e5dac4}
.reception-count{position:absolute;left:50%;transform:translateX(-50%);top:32px;background:#fff7de;border:2px solid #dcad7a;border-radius:8px;font-weight:950;font-size:10px;padding:3px 5px;white-space:nowrap}
.bay-scene{padding:9px 7px 12px}
.bay-chip{min-height:119px}
.bay-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.walking-robot.exit{z-index:12;filter:drop-shadow(0 5px 4px #6a5b4277)}
.walking-robot.exit .bye-bubble{position:absolute;top:-16px;left:-20px;white-space:nowrap;border:2px solid #d2b585;background:#fff8df;color:#59745c;border-radius:9px;padding:2px 5px;font-size:10px;font-weight:1000}
.exit-sign{position:absolute;bottom:8px;left:4px;z-index:6;color:#e9f7d2;background:#658873;border:2px solid #456b57;border-radius:5px;padding:2px 5px;font-size:9px;font-weight:900}
.station-controls{display:flex;align-items:center;gap:8px;margin-top:12px}
.station-controls .bigbutton{flex:1;min-height:54px}
.bag-summary{flex:1.1;padding:7px;border:2px solid #ccbfa0;border-radius:10px;background:#fff7e6;min-height:54px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.5}
.station-tip{text-align:center;font-weight:800;font-size:11px;color:#718375;margin:10px 0 12px}
.repair-checklist{display:grid;gap:7px;margin:8px 0 11px}
.repair-order{border:2px solid #d9c39b;background:#fff9e9;padding:9px 10px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:12px}
.repair-order .item-icon{font-size:24px;flex:none;line-height:1}
.repair-order strong{display:block;color:#3b5a4b;font-size:12px}
.repair-order small{display:block;color:#7b8572;font-weight:750;margin-top:2px}
.repair-order.finished{background:#e8f5da;border-color:#86b392}
.repair-order.pending{border-color:#e9a977}
.repair-instruction{padding:10px;border-radius:10px;border:2px solid #e5bd8d;background:#fff3d5;font-size:12px;font-weight:1000;text-align:center;color:#654c38;margin:3px 0 10px}
.repair-instruction.active{background:#fff1c1;border-color:#e49d5d;box-shadow:0 0 10px #f9be6888}
.repair-robot{width:min(300px,100%);height:286px;margin:6px auto 12px;overflow:visible;background:radial-gradient(circle at center,#e8f3dc 0 35%,#d4eacb 35% 36%,transparent 37%)}
.repair-robot .giant{inset:10px 27px 16px}
.repair-robot .socket{width:98px;min-height:51px;height:auto;padding:4px 3px;font-size:10px;border-width:3px;box-shadow:0 3px 9px #8b764133;background:#fff6dbf5}
.repair-robot .socket strong{display:block;font-size:11px;color:#634c34}
.repair-robot .socket small{display:block;font-size:9px;margin-top:2px;color:#795e47}
.repair-robot .socket.head{top:24%;left:77%}
.repair-robot .socket.arm{top:49%;left:21%}
.repair-robot .socket.body{top:59%;left:81%}
.repair-robot .socket.foot{top:84%;left:26%}
.socket.unneeded{border-color:#c5d2c5;background:#eff1e9dd;color:#98a69a;opacity:.55}
.socket.match{background:#fff0b8;border:4px solid #e88a43;box-shadow:0 0 0 6px #ffcc6b99,0 0 24px #ffc061;animation:glow 1s infinite}
.socket.fixed{background:#e1ffe1ed;border-color:#71b09a;box-shadow:none;opacity:1}
.parts-selection{justify-content:stretch;gap:7px}
.piece{flex:1 1 44%;min-height:48px;line-height:1.25}
.piece small{display:block;font-size:10px;margin-top:3px;font-weight:800;color:#8b7d65}
.piece.selected{border-color:#e88239;background:#ffdf9a;box-shadow:inset 0 0 0 2px #ffeeb9}
.piece.useful{border-color:#97bba4;background:#f5ffe9}

 panel(`🔧 ${r.short}を修理中`, `<p class="help">カルテに書かれた部品を、光る交換箇所へ運ぼう！</p><div class="repair-instruction ${target?'active':''}">${instruction}</div>
 <div class="parts-selection">${S.bag.length?S.bag.map((p,i)=>`<button class="piece " data-drag-part="${p}" aria-label="${PARTS[p].name}をドラッグして取り付ける">${PARTS[p].icon} ${PARTS[p].name}<small>${LOC_NAMES[PARTS[p].loc]}</small></button>`).join(''):'<span class="help">バッグが空っぽ！倉庫で部品を取ろう</span>'}</div>
 <div class="repair-robot"><span class="giant">${robotSvg(r,emotion(r)==='angry'?'sad':emotion(r))}</span>${hotspots.map(([loc,label])=>{let part=r.parts.find(p=>PARTS[p].loc===loc);let fixed=part&&r.done.includes(part),job=part&&r.working.find(j=>j.part===part),needed=part&&!fixed&&!job;return `<button class="socket ${fixed?'fixed':job?'in-progress':!needed?'unneeded':target===loc?'match':'selected'} ${loc}" data-drop-loc="${loc}">${fixed?'✓ 修理済':job?`⏳ ${PARTS[part].name}<small>${job.left.toFixed(1)}秒</small>`:needed?`${PARTS[part].icon}<strong>${PARTS[part].name}</strong><small>${label}</small>`:`${label}<small>異常なし</small>`}</button>`}).join('')}</div>
 <div class="repair-checklist">${guide}</div><div class="repairhint">${todo.length?'部品をドラッグすると、交換箇所が光るよ！':'部品交換完了！充電が終わると自動でお見送り'}</div>

 <button class="cta warm" data-action="warehouse">📦 倉庫で部品を取る</button><button class="cta ghost" data-action="bed" data-id="${id}">← 診察台に戻る</button>`);return
} }
function drawCover(){let d=profile.day;
if(S.phase==='result'){
 const won=S.clear,bonus=goalMet(S.goals.bonus);const amount=S.coins;
 $('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">CLOSED · DAY ${d}</span><h2>${won?'🎉 本日の営業クリア！':'🌙 今日の営業は終了'}</h2>
 <div class="characters"><span class="mini">${robotSvg({model:'delivery'},'happy')}</span><span class="mini">${robotSvg({model:'vip'},won?'happy':'normal')}</span><span class="mini">${robotSvg({model:'guide'},'happy')}</span></div>
 <div class="goal-result ${won?'won':'lost'}"><b>${won?'✅':'❌'} ${S.goals.primary.title}</b><span>${goalMeter(S.goals.primary)}</span></div><div class="goal-result"><b>${bonus?'🌟':'☆'} ${S.goals.bonus.title}</b><span>${goalMeter(S.goals.bonus)}</span></div>
 <div class="result-stats"><div><strong>${S.served}</strong><small>修理台数</small></div><div><strong>${S.missed}</strong><small>退店・取り逃し</small></div><div><strong>${cash(amount)}</strong><small>本日の売上</small></div></div>
 <p>評判 <b>⭐ ${profile.reputation}/100</b>（${S.repChange>=0?'+':''}${S.repChange}）<br>所持金 <b>${cash(profile.wallet)}</b></p>
 <button class="cta warm" data-action="shop">🛒 工場・設備を強化する</button><button class="cta" data-action="${won?'next':'retry'}">▶ ${won?'次の日をはじめる':'同じ日を再挑戦'}</button><div class="help">クリア条件は日替わり。達成できなくても修理報酬は貯まるよ！</div></div></div>`;return
}
if(S.phase==='pause'){$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">BREAK TIME</span><h2>ちょっと休憩 ☕</h2><p>残り ${fmt(S.time)}<br>準備ができたら戻ってね！</p><button class="cta" data-action="resume">▶ お仕事再開！</button><button class="cta ghost" data-action="quit">今日はここまで</button></div></div>`;return}
$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">RETRO ROBOT REPAIR SHOP · v0.4</span><h1>ロボっと工房</h1><div style="font-weight:950;color:#be855c">見下ろし工場の、3分間の修理屋さん。</div><div class="characters"><span class="mini wave">${robotSvg({model:'delivery'},'happy')}</span><span class="mini">${robotSvg({model:'vip'},'normal')}</span><span class="mini wave">${robotSvg({model:'guide'},'happy')}</span></div>
<div class="rules"><b>きょうのおしごと</b><br>① 受付でカルテを確認して診察台へ案内<br>② 倉庫で部品を覚えてピックアップ<br>③ ドラッグで部品をセット、充電も並列に！<br>④ 金ぴかVIPは30%で来店、評判が大幅UP！<br>⑤ 毎日のランダム目標を達成しよう！</div><p style="margin:8px 0;font-size:12px">DAY ${d} · ⭐評判 ${profile.reputation}/100 · 所持金 ${cash(profile.wallet)}<br>${profile.roomTier===1?'小型店舗':'大型店舗'} · 診察台 ${profile.beds}台</p><button class="cta" data-action="start">🛠 お店を開ける！</button><button class="cta warm" data-action="shop">🛒 店舗・設備をアップグレード</button><div class="help">スマホでドラッグ修理 · 過去のセーブを引き継ぎ</div></div></div>`
}
function shop(){let cap=profile.roomTier===1?3:6;let bedCost=170+profile.beds*100,bagCost=190+(profile.bagMax-2)*150,chargeCost=200+profile.chargeLevel*170,walkCost=160+profile.walkLevel*180;
S.shopOrigin=S.phase==='play'?'play':S.phase;
if(S.phase==='play')S.phase='pause';
let items=[{key:'room',title:'🏠 大きな店舗へ引っ越し',desc:`小型は最大3台。大型にすると最大6台を置ける！`,cost:1250,max:profile.roomTier===2},{key:'bed',title:'🛏 診察台を1台増やす',desc:`現在 ${profile.beds}/${cap}台。工場の収容力を上げる`,cost:bedCost,max:profile.beds>=cap},{key:'bag',title:'👜 バッグを広くする',desc:`現在 ${profile.bagMax}/5個。倉庫の往復回数を減らす`,cost:bagCost,max:profile.bagMax>=5},{key:'charge',title:'🔌 高速充電器',desc:`時間のかかる充電を短縮（Lv.${profile.chargeLevel}/3）`,cost:chargeCost,max:profile.chargeLevel>=3},{key:'walk',title:'🛼 自動案内レール',desc:`診察台へ早く移動（Lv.${profile.walkLevel}/3）`,cost:walkCost,max:profile.walkLevel>=3}];
$('#cover').innerHTML=`<div class="overlay"><div class="cover"><span class="badge">WORKSHOP UPGRADES</span><h2>🛒 工場ショップ</h2><p>所持金 <b>${cash(profile.wallet)}</b> · ⭐評判 ${profile.reputation}/100<br>設備を増やして繁盛店を目指そう！</p><div class="shoplist">${items.map(i=>`<div class="shopentry"><div><b>${i.title}</b><small>${i.desc}</small></div><button data-action="buy" data-id="${i.key}" ${i.max||profile.wallet<i.cost?'disabled':''}>${i.max?'MAX':cash(i.cost)}</button></div>`).join('')}</div><button class="cta ghost" data-action="shopclose">← 戻る</button></div></div>`;S.shopOpened=true
}
function buy(k){const cap=profile.roomTier===1?3:6;
let price=({room:1250,bed:170+profile.beds*100,bag:190+(profile.bagMax-2)*150,charge:200+profile.chargeLevel*170,walk:160+profile.walkLevel*180})[k];
if(price===undefined||profile.wallet<price)return;
if(k==='room'&&profile.roomTier===2||k==='bed'&&profile.beds>=cap||k==='bag'&&profile.bagMax>=5||k==='charge'&&profile.chargeLevel>=3||k==='walk'&&profile.walkLevel>=3)return;
profile.wallet-=price;if(k==='room')profile.roomTier=2;if(k==='bed')profile.beds++;if(k==='bag')profile.bagMax++;if(k==='charge')profile.chargeLevel++;if(k==='walk')profile.walkLevel++;save();shop()
}
function handle(action,id){if(action==='start'){begin();return}if(action==='pause'){S.phase='pause';drawCover();return}if(action==='resume'){S.phase='play';$('#cover').innerHTML='';draw();S.nextTick=performance.now();return}if(action==='quit'){S.phase='cover';S.view=null;$('#layer').innerHTML='';drawCover();return}if(action==='next'){if(S.clear){profile.day++;save();begin()}return}if(action==='retry'){begin();return}if(action==='shop'){shop();return}if(action==='buy'){buy(id);return}if(action==='shopclose'){S.shopOpened=false;if(S.shopOrigin==='play'){S.phase='pause'}else S.phase=S.shopOrigin||'cover';drawCover();return}
if(S.phase!=='play')return;
if(action==='close'){S.view=null;S.selectedPart=null;drawPanel();return}if(action==='reception'){const r=S.queue[0];if(r){S.focusRobotId=r.id;S.view={type:'chart',id:r.id};drawPanel()}else announce('受付にお客さんはまだいないよ');return}if(action==='chart'){S.focusRobotId=+id;S.view={type:'chart',id:+id};drawPanel();return}if(action==='assign'){assign(+id);return}if(action==='warehouse'){S.view={type:'warehouse'};S.selectedPart=null;drawPanel();return}if(action==='pick'){takePart(id);return}if(action==='returnpart'){let p=S.bag[+id];if(p)discardPart(p);return}if(action==='quickbed'){let r=S.bays.find(Boolean);if(!r){announce('まだ診察台にロボがいないよ');return}S.focusRobotId=r.id;S.view={type:'bed',id:r.id};drawPanel();return}if(action==='bed'){let r=getRobot(+id);if(!r||r.seat<0)return;S.focusRobotId=r.id;S.view={type:'bed',id:r.id};drawPanel();return}if(action==='charge'){beginCharge(+id);return}if(action==='repair'){S.focusRobotId=+id;S.view={type:'repair',id:+id};S.selectedPart=null;drawPanel();return}if(action==='deliver'){deliver(+id);return}}

// v0.3: mobile finger-drag repair operation. The actual part is taken only after valid drop.
const canInstall=(r,p)=>!!(r&&r.parts.includes(p)&&!r.done.includes(p)&&!r.working.some(j=>j.part===p));
function drawDragTarget(){
 if(!activeDrag)return;
 let r=getRobot(activeDrag.patientId);
 document.querySelectorAll('[data-drop-loc]').forEach(el=>{
   const isTarget=canInstall(r,activeDrag.part)&&PARTS[activeDrag.part].loc===el.dataset.dropLoc;
   el.classList.toggle('drag-target',isTarget);
 });
}
function startDrag(event){
 if(S.phase!=='play'||!S.view||S.view.type!=='repair'||activeDrag||event.button>0)return;
 const part=event.target.closest('[data-drag-part]');if(!part)return;
 const p=part.dataset.dragPart;if(!S.bag.includes(p))return;
 event.preventDefault();
 const label=PARTS[p];
 const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.innerHTML=`<span>${label.icon}</span><b>${label.name}</b>`;
 document.body.appendChild(ghost);
 activeDrag={part:p,patientId:S.view.id,pointerId:event.pointerId,ghost};
 document.body.classList.add('drag-in-progress');
 moveGhost(event.clientX,event.clientY);
 drawDragTarget();
}
function moveGhost(x,y){if(!activeDrag)return;activeDrag.x=x;activeDrag.y=y;activeDrag.ghost.style.left=x+'px';activeDrag.ghost.style.top=y+'px';}
function locNear(x,y){
 let best=null,dist=Infinity;
 for(const el of document.querySelectorAll('[data-drop-loc]')){
   const b=el.getBoundingClientRect();const cx=b.left+b.width/2,cy=b.top+b.height/2;
   const dx=Math.max(Math.abs(x-cx)-b.width/2,0),dy=Math.max(Math.abs(y-cy)-b.height/2,0);
   const d=Math.hypot(dx,dy);
   if(d<dist){dist=d;best=el.dataset.dropLoc}
 }
 return dist<=22?best:null;
}
function stopDrag(event,cancelled=false){
 if(!activeDrag||event.pointerId!==activeDrag.pointerId)return;
 if(event.cancelable)event.preventDefault();
 const {ghost,part,patientId}=activeDrag;
 const loc=cancelled?null:locNear(event.clientX,event.clientY);
 ghost.remove();activeDrag=null;
 document.body.classList.remove('drag-in-progress');
 document.querySelectorAll('[data-drop-loc]').forEach(el=>el.classList.remove('drag-target'));
 if(!cancelled&&loc){attach(patientId,loc,part)}
 else if(!cancelled){announce('取り付け位置まで部品を運んで、指を離してね！')}
 if(deferredDraw){deferredDraw=false;draw()}
}
document.addEventListener('pointerdown',startDrag,{passive:false});
document.addEventListener('pointermove',event=>{if(activeDrag&&event.pointerId===activeDrag.pointerId){if(event.cancelable)event.preventDefault();moveGhost(event.clientX,event.clientY)}},{passive:false});
document.addEventListener('pointerup',event=>stopDrag(event),{passive:false});
document.addEventListener('pointercancel',event=>stopDrag(event,true),{passive:false});

document.addEventListener('click',e=>{let node=e.target.closest('[data-action]');if(!node)return;e.preventDefault();handle(node.dataset.action,node.dataset.id)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.phase==='play'){S.phase='pause';drawCover()}});
function tick(t){let dt=S.nextTick?Math.min((t-S.nextTick)/1000,.07):0;S.nextTick=t;if(S.phase==='play'){step(dt)}requestAnimationFrame(tick)}
window.addEventListener('pageshow',()=>{S.nextTick=performance.now()});drawCover();requestAnimationFrame(tick);
})();
</script>
</body></html>
