
name: Robo Repair iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'RoboRepair_AppIcon_1024.png'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Capacitor project
        run: |
          set -euo pipefail

          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@8 @capacitor/ios@8
          npm install --save-dev @capacitor/cli@8

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.narumi102416.roborepair",
            "appName": "ロボっと工房",
            "webDir": "www"
          }
          EOF

          npx cap add ios

      # Official app icon
      - name: Set Robo Repair app icon
        run: |
          set -euo pipefail

          ICON_SOURCE="RoboRepair_AppIcon_1024.png"
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          test -f "$ICON_SOURCE"
          mkdir -p "$ICON_DIR"

          cp "$ICON_SOURCE" "$ICON_DIR/AppIcon-512@2x.png"

          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-512@2x.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          echo "Robo Repair app icon installed!"

      # Set build number to 3
      - name: Set iOS build number
        run: |
          set -euo pipefail

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 3" \
            ios/App/App/Info.plist

          echo "iOS build number set to 3"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Apple signing files
        env:
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          PLIST_PATH="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PLIST_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PLIST_PATH")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PLIST_PATH")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PLIST_PATH")

          if [[ "$PROFILE_APP_ID" != *".com.narumi102416.roborepair" ]]; then
            echo "::error::Provisioning profile Bundle ID mismatch"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # Archive iPhone-only app
      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RoboRepair.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION=3 \
            TARGETED_DEVICE_FAMILY=1 \
            archive

      # Verify iPhone-only support and build number
      - name: Verify iPhone-only build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import plistlib

          path = (
              "build/RoboRepair.xcarchive/"
              "Products/Applications/App.app/Info.plist"
          )

          with open(path, "rb") as f:
              info = plistlib.load(f)

          build_number = str(info.get("CFBundleVersion", ""))
          devices = info.get("UIDeviceFamily", [])

          print(f"Archived build number: {build_number}")
          print(f"Supported device families: {devices}")

          if build_number != "3":
              raise SystemExit("Build number is not 3")

          if devices != [1]:
              raise SystemExit(
                  f"Expected iPhone-only [1], got {devices}"
              )

          print("iPhone-only build verified!")
          PY

      - name: Export App Store IPA
        run: |
          set -euo pipefail

          mkdir -p build/export

          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {
                  "com.narumi102416.roborepair": os.environ["PROFILE_UUID"]
              }
          }

          with open("build/ExportOptions.plist", "wb") as f:
              plistlib.dump(options, f)
          PY

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/RoboRepair.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist"

      - name: Save IPA file
        uses: actions/upload-artifact@v4
        with:
          name: RoboRepair-AppStore-IPA
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          if [[ "$ASC_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout

          IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"

          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" \
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
