
name: Robo Repair iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@8 @capacitor/ios@8
          npm install --save-dev @capacitor/cli@8

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.narumi102416.roborepair",
            "appName": "ロボっと工房",
            "webDir": "www"
          }
          EOF

          npx cap add ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Save build result
        uses: actions/upload-artifact@v4
        with:
          name: RoboRepair-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
